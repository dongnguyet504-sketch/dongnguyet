<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同氏月 | 個人專業檔案</title>

<style>
:root {
    --linkedin-blue: #0a66c2;
    --bg-color: #f3f2ef;
    --text-main: rgba(0,0,0,0.9);
    --text-sub: rgba(0,0,0,0.6);
    --card-border: #e0e0e0;
}

body {
    font-family: -apple-system, system-ui, Arial, sans-serif;
    background: var(--bg-color);
    margin: 0;
    color: var(--text-main);
}

.cover-photo {
    height: 200px;
    background: url('https://images.unsplash.com/photo-1555921015-5532091f6026');
    background-size: cover;
    background-position: center;
}

.container {
    max-width: 800px;
    margin: -80px auto 40px;
    padding: 0 15px;
}

.card {
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
}

.profile-header {
    padding-top: 80px;
    position: relative;
}

.photo-container {
    position: absolute;
    top: -80px;
    left: 24px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #fff;
}

.photo-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h1 { margin: 0; font-size: 28px; }
.job-title { margin: 4px 0; color: var(--text-sub); }
.location { color: var(--text-sub); font-size: 14px; }

.contact-info a {
    margin-right: 10px;
    color: var(--linkedin-blue);
    text-decoration: none;
    font-weight: 600;
}

.btn-primary {
    display: inline-block;
    background: var(--linkedin-blue);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    margin-top: 10px;
}

/* SLIDESHOW */
.slideshow {
    position: relative;
    height: 300px;
    border-radius: 12px;
    overflow: hidden;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1s ease;
}

.slide.active {
    opacity: 1;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.caption {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 15px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    color: white;
}

.dots {
    text-align: center;
    margin-top: 10px;
}

.dot {
    height: 10px;
    width: 10px;
    margin: 0 4px;
    display: inline-block;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
}

.dot.active {
    background: var(--linkedin-blue);
}

/* SKILLS */
.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.skill-tag {
    background: #e7f3ff;
    color: var(--linkedin-blue);
    padding: 6px 12px;
    border-radius: 15px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="cover-photo"></div>

<div class="container">

<!-- PROFILE -->

    <div class="contact-info">
        <a href="mailto:dongnguyet504@gmail.com">Email</a>

        <a href="https://www.facebook.com/dongnguyet.thy09">Facebook</a>
        <a href="https://www.tiktok.com/@anhnguyet83867">TikTok</a>
    </div>

    <a class="btn-primary" href="mailto:dongnguyet504@gmail.com">聯絡我</a>
</header>

<!-- ABOUT -->
<section class="card">
<h2>關於我</h2>
<p>大家好，我叫同氏月。我出生於2005年，目前是一名學生。我是一個喜歡學習的人，特別對語言和網頁設計感興趣。我每天都努力提升自己，希望未來能夠學習更多新的技能。</p>
</section>

<!-- SLIDESHOW -->
<section class="card">
<h2>越南美麗景點</h2>

<div class="slideshow">

    <div class="slide active">
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21">
        <div class="caption">
            <h3>下龍灣</h3>
        </div>
    </div>

    <div class="slide">
        <img src="https://images.unsplash.com/photo-1528127269322-539801943592">

        </div>

        <div class="caption">
            <h3>會安古鎮</h3>
        </div>
    </div>

    <div class="slide">
        <img src="https://images.unsplash.com/photo-1559592413-7cec4d0cae2b">

</div>

<div class="dots">
    <span class="dot active"></span>

    <span class="dot"></span>

<div class="skills">

     <div class="skill-tag">購物</div>
</div>

</div>

<footer style="text-align:center; padding:20px; font-size:12px;">
© 2026 Portfolio
</footer>

<script>
let index = 0;
const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

function showSlide(i) {
    slides.forEach(s => s.classList.remove("active"));
    dots.forEach(d => d.classList.remove("active"));
    slides[i].classList.add("active");
    dots[i].classList.add("active");
}

function nextSlide() {
    index = (index + 1) % slides.length;
    showSlide(index);
}

setInterval(nextSlide, 3000);

dots.forEach((dot, i) => {
    dot.addEventListener("click", () => {
        index = i;
        showSlide(index);
    });
});
</script>

</body>
</html>
